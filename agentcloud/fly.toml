# Fly.io config. Change "app" to a unique name before your first deploy.
app = "agentcloud-demo-change-me"
primary_region = "sin"          # Singapore

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"    # keep it always on, so Telegram and the QR demo always work
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "agentcloud_data"    # persistent disk for the database and agent code
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
